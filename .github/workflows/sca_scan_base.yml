name: SCA Scan Base

on:
  workflow_call:
    inputs:
      working-path:
        description: 'The path of the pom.xml'
        required: true
        type: string

      name-of-snyk-step:
        description: 'The name of the job that executes the snyk action'
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: true

jobs:
  snyk-action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'

    - name: Build PWSS Library - Cryptographic Algorithm
      run: make install

    - name: Setup Snyk
      uses: snyk/actions/setup@master

    - name: ${{ inputs.name-of-snyk-step }}
      id: snyk-test
      working-directory: ${{ inputs.working-path }}
      run: snyk test
      continue-on-error: false
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
